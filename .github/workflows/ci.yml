name: RecSysLab verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_USER: recsyslab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: recsyslab
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U recsyslab -d recsyslab" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://recsyslab:ci-only-password@127.0.0.1:5432/recsyslab
      MPLCONFIGDIR: /tmp/matplotlib
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,phase3,phase4,phase6]'
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/init_compose.py
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker compose --env-file .env.compose run --build --rm bootstrap
      - run: docker compose --env-file .env.compose up --build --wait --wait-timeout 180
      - run: docker compose --env-file .env.compose run --rm -e MLFLOW_TRACKING_URI=http://mlflow:5000 bootstrap python scripts/track_selected_release.py
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke_phase4.py
      - run: docker compose --env-file .env.compose exec -T prometheus promtool check rules /etc/prometheus/alerts.yml
      - name: Container logs
        if: always()
        run: docker compose --env-file .env.compose logs --no-color
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.compose down --volumes
